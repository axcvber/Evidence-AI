name: Set up the workspace
description: Node 24, pnpm (version from package.json) with a cached store, dependencies, and env files from the committed examples.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        # pnpm isn't installed yet at this point; pnpm/action-setup caches its store instead.
        package-manager-cache: false

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: true

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # The .env.example files hold local-only placeholder values (no real secrets), so CI uses
    # them as they are: the same database roles, ports and passwords as a developer machine.
    - name: Create env files from the examples
      shell: bash
      run: pnpm env:init
